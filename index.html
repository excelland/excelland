<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="app-version" content="1.3.1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="theme-color" content="#143d2b" />
    <meta name="description" content="EXCEL-land：用闯关方式练习 Excel 公式、表格操作与数据分析。" />
    <title>EXCEL-land · Excel 公式闯关</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' focusable='false'%3E%3Crect width='64' height='64' rx='16' fill='%23EAF8DF'/%3E%3Cpath d='M5 44c9-5 18-4 27 0s18 5 27 0v10c-9 5-18 4-27 0S14 49 5 54z' fill='%23B7E98C'/%3E%3Cpath d='M13 43c9-8 29-8 38 0-9 9-29 9-38 0z' fill='%2358CC02'/%3E%3Cpath d='M32 39c1-8 4-14 8-18' fill='none' stroke='%231F6B2A' stroke-width='3.4' stroke-linecap='round'/%3E%3Cpath d='M40 20c-7-4-12-2-14 2 5 1 10 1 14-2zm0 0c1-7 6-10 11-10-1 6-4 9-11 10zm0 0c5 1 8 4 10 8-5-1-8-3-10-8z' fill='%232E9E34'/%3E%3Crect x='10' y='14' width='16' height='13' rx='3' fill='%23FFFFFF'/%3E%3Cpath d='M15 14v13m5-13v13m-10-6.5h16' fill='none' stroke='%232E9E34' stroke-width='1.25'/%3E%3Cpath d='M11 49c3 2 7 2 10 0' fill='none' stroke='%23F4FFE9' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="src/styles/base.css?v=1.3.1-r1" />
    <link rel="stylesheet" href="src/lab/styles.css?v=1.3.1-r1" />
  </head>
  <body>
    <div class="mode-screen" id="modeScreen"></div>
    <div class="app-shell" id="appShell" hidden>
      <aside class="sidebar" id="sidebar" aria-label="关卡地图" data-i18n-aria="nav.map">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" focusable="false">
              <rect width="64" height="64" rx="16" fill="#EAF8DF" />
              <path d="M5 44c9-5 18-4 27 0s18 5 27 0v10c-9 5-18 4-27 0S14 49 5 54z" fill="#B7E98C" />
              <path d="M13 43c9-8 29-8 38 0-9 9-29 9-38 0z" fill="#58CC02" />
              <path d="M32 39c1-8 4-14 8-18" fill="none" stroke="#1F6B2A" stroke-width="3.4" stroke-linecap="round" />
              <path d="M40 20c-7-4-12-2-14 2 5 1 10 1 14-2zm0 0c1-7 6-10 11-10-1 6-4 9-11 10zm0 0c5 1 8 4 10 8-5-1-8-3-10-8z" fill="#2E9E34" />
              <rect x="10" y="14" width="16" height="13" rx="3" fill="#FFFFFF" />
              <path d="M15 14v13m5-13v13m-10-6.5h16" fill="none" stroke="#2E9E34" stroke-width="1.25" />
              <path d="M11 49c3 2 7 2 10 0" fill="none" stroke="#F4FFE9" stroke-width="2" stroke-linecap="round" />
            </svg>
          </div>
          <div class="brand-copy">
            <strong data-i18n="app.brand">公式岛</strong>
            <span data-i18n="app.tagline">Excel 公式 · 闯关练习</span>
          </div>
        </div>

        <div class="level-map">
          <div class="map-kicker" id="mapKicker" data-i18n="app.mapKicker">公式、表格与数据实践</div>
          <div class="map-title" id="mapTitle" data-i18n="app.mapTitle">Excel 完整闯关课程</div>
          <div class="overall-progress">
            <div class="overall-progress-copy">
              <span data-i18n="label.overallProgress">总进度</span>
              <strong id="overallProgressText">已完成 0 / 36 关</strong>
            </div>
            <div class="overall-progress-track" aria-hidden="true"><div id="overallProgressBar"></div></div>
          </div>
          <div class="map-path" id="levelMap"></div>
        </div>

        <div class="sidebar-footer">
          <div class="daily-goal">
            <div class="goal-ring"><span>0</span></div>
            <div>
              <strong id="goalTitle" data-i18n="goal.title">今日目标</strong>
              <p id="goalCopy" data-i18n="goal.copy">完成 1 个关卡</p>
            </div>
          </div>
          <div class="tiny-note" data-i18n="goal.note">循序渐进，稳稳掌握 Excel。</div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="icon-button mobile-map-toggle" type="button" data-action="toggle-mobile-map" aria-label="打开关卡地图" data-i18n-aria="nav.openMap">
            <span></span><span></span><span></span>
          </button>
          <div class="lesson-progress">
            <div class="progress-copy">
              <strong id="levelTitle">Excel 完整闯关课程</strong>
              <span id="stepLabel">第 1 / 1 步</span>
            </div>
            <div class="step-progress" id="stepProgress" role="group" data-i18n-aria="progress.steps"></div>
          </div>
          <div class="top-stats">
            <button class="mode-switch-button" type="button" data-action="switch-mode" aria-label="切换学习模式" data-i18n-aria="mode.switchAria">
              <span class="mode-switch-glyph" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><path d="M3 7h12m-3-3 3 3-3 3M17 13H5m3-3-3 3 3 3"></path></svg></span>
              <span id="modeSwitchLabel" data-i18n="mode.switch">切换模式</span>
            </button>
            <span class="build-badge" id="buildBadge">顺序解锁</span>
            <button class="icon-button settings-button" type="button" data-action="open-settings" aria-label="打开设置" data-i18n-aria="nav.settings">
              <span class="settings-gear" aria-hidden="true"><svg class="ui-icon" viewBox="0 0 20 20" focusable="false"><path d="M3 5h14M3 10h14M3 15h14"></path><circle cx="7" cy="5" r="1.6"></circle><circle cx="13" cy="10" r="1.6"></circle><circle cx="9" cy="15" r="1.6"></circle></svg></span>
            </button>
          </div>
        </header>

        <section class="workspace" aria-live="polite">
          <div id="lessonView" class="lesson-view"></div>
        </section>
      </main>
    </div>

    <div class="mobile-sheet-backdrop" id="mobileMapBackdrop" hidden></div>
    <div class="settings-backdrop" id="settingsBackdrop" hidden><div id="settingsModal"></div></div>
    <div class="completion-backdrop" id="completionModal" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script src="src/core/formula.js?v=1.3.1-r1"></script>
    <script src="src/i18n/base.js?v=1.3.1-r1"></script>
    <script src="src/lab/i18n.js?v=1.3.1-r1"></script>
    <script src="src/app/sound.js?v=1.3.1-r1"></script>
    <script src="src/content/course-data.js?v=1.3.1-r1"></script>
    <script src="src/content/lesson-kit.js?v=1.3.1-r1"></script>
    <script src="src/content/banks/practice.js?v=1.3.1-r1"></script>
    <script src="src/core/answer.js?v=1.3.1-r1"></script>
    <script src="src/core/selection.js?v=1.3.1-r1"></script>
    <script src="src/core/sheet-ops.js?v=1.3.1-r1"></script>
    <script src="src/lab/engine.js?v=1.3.1-r1"></script>
    <script src="src/app/render.js?v=1.3.1-r1"></script>
    <script src="src/app/main.js?v=1.3.1-r1"></script>
  </body>
</html>
